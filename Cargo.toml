[package]
name = "my_slint_app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.9"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] } 
serde_json = "1.0" 
reqwest = { version = "0.12", features = ["json"] }
csv = "1.3"

[build-dependencies]
slint-build = "1.9"